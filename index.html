<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandboxels Multi-Element Mod Creator</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Silkscreen&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], pixel: ['Silkscreen', 'cursive'] },
          colors: {
            sandbox: { bg: '#0f172a', card: '#1e293b', border: '#334155' }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    canvas { image-rendering: pixelated; }
    /* Prevent focus outline jumpiness */
    input:focus, select:focus, textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased">

  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-pixel text-xl shadow-lg">SB</div>
        <div>
          <h1 class="font-pixel text-lg text-blue-400 tracking-wide">SANDBOXELS <span class="text-xs px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-sans font-semibold border border-blue-500/30">MOD STUDIO</span></h1>
          <p class="text-xs text-slate-400">Multi-Element Mod Creator (Bugfixed UI)</p>
        </div>
      </div>
      <button onclick="openExportModal()" class="px-4 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-medium text-sm rounded-lg shadow-lg flex items-center gap-2 transition">
        <i class="fa-solid fa-file-code"></i> Mod Exportieren (.js)
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- LEFT PANEL: Elements List -->
    <section class="lg:col-span-3 flex flex-col gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col h-[calc(100vh-120px)] sticky top-20 shadow-xl">
        <div class="flex items-center justify-between mb-3 pb-3 border-b border-slate-800">
          <h2 class="font-semibold text-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-cubes text-blue-400"></i> Elemente (<span id="elCount">0</span>)
          </h2>
          <button onclick="createNewElement()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-md flex items-center gap-1.5 transition">
            <i class="fa-solid fa-plus"></i> Neu
          </button>
        </div>
        <div id="sidebar-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- MIDDLE PANEL: Dynamic Editor -->
    <section class="lg:col-span-5 flex flex-col gap-6">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl flex flex-col min-h-[500px]">
        
        <!-- Editor Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
          <div class="flex items-center gap-3">
            <div id="editor-header-color" class="w-10 h-10 rounded border-2 border-slate-700"></div>
            <div>
              <h2 id="editor-header-name" class="font-bold text-lg text-white">Lade...</h2>
              <p id="editor-header-id" class="text-xs text-slate-400 font-mono">ID: ...</p>
            </div>
          </div>
          <div class="flex gap-2">
            <button onclick="duplicateCurrent()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs border border-slate-700" title="Duplizieren"><i class="fa-solid fa-copy"></i></button>
            <button onclick="deleteCurrent()" class="p-2 bg-red-950/50 hover:bg-red-900/80 text-red-400 rounded-lg text-xs border border-red-800/50" title="Löschen"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>

        <!-- Editor Tabs -->
        <div class="flex border-b border-slate-800 text-xs font-medium mb-4" id="editor-tabs">
          <!-- Populated by JS -->
        </div>

        <!-- THE FIX: DYNAMIC FORM CONTAINER -->
        <div id="editor-form-content" class="flex-1 overflow-y-auto pr-2">
          <!-- Form HTML is injected here by JS -->
        </div>

      </div>
    </section>

    <!-- RIGHT PANEL: Simulator -->
    <section class="lg:col-span-4 flex flex-col gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl flex flex-col">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
          <h2 class="font-semibold text-slate-200 flex items-center gap-2 text-sm">
            <i class="fa-solid fa-gamepad text-emerald-400"></i> Simulator
          </h2>
          <div class="flex gap-1">
            <button onclick="toggleSimPause()" id="btnPause" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs"><i class="fa-solid fa-pause"></i></button>
            <button onclick="clearSim()" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs"><i class="fa-solid fa-rotate-left"></i></button>
          </div>
        </div>
        
        <div class="relative aspect-square w-full bg-slate-950 rounded-lg overflow-hidden border border-slate-800 mb-3 flex items-center justify-center select-none">
          <canvas id="simCanvas" width="128" height="128" class="w-full h-full cursor-crosshair touch-none"></canvas>
          <div class="absolute top-2 left-2 bg-slate-900/80 backdrop-blur px-2 py-1 rounded text-[10px] text-slate-300 font-mono">
            FPS: <span id="fpsCount">0</span> | P: <span id="particleCount">0</span>
          </div>
        </div>

        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">Pinsel Element</label>
            <select id="brushSelect" onchange="simState.brush = this.value" class="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 font-mono"></select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-400 mb-1">Größe: <span id="bSizeDisp">3</span>px</label>
              <input type="range" min="1" max="10" value="3" oninput="simState.size = parseInt(this.value); document.getElementById('bSizeDisp').innerText = this.value" class="w-full">
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Werkzeug</label>
              <div class="flex gap-1">
                <button onclick="setTool('heat')" id="tool-heat" class="flex-1 py-1 bg-slate-800 text-orange-400 rounded">Hitze</button>
                <button onclick="setTool('cold')" id="tool-cold" class="flex-1 py-1 bg-slate-800 text-cyan-400 rounded">Kälte</button>
                <button onclick="setTool('eraser')" id="tool-eraser" class="flex-1 py-1 bg-slate-800 text-slate-400 rounded">Radierer</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="exportModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-3xl w-full p-6 flex flex-col max-h-[90vh]">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-code text-blue-400"></i> Mod Code (.js)</h3>
        <button onclick="closeExportModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <textarea id="exportText" readonly class="w-full flex-1 bg-slate-950 border border-slate-800 rounded p-4 font-mono text-xs text-emerald-400 mb-4 whitespace-pre overflow-y-auto"></textarea>
      <div class="flex justify-between">
        <button onclick="copyCode()" class="px-4 py-2 bg-slate-800 text-white text-xs rounded hover:bg-slate-700"><i class="fa-solid fa-copy"></i> Kopieren</button>
        <div class="flex gap-2">
          <button onclick="closeExportModal()" class="px-4 py-2 bg-slate-800 text-white text-xs rounded">Schließen</button>
          <button onclick="downloadCode()" class="px-4 py-2 bg-blue-600 text-white text-xs rounded hover:bg-blue-500"><i class="fa-solid fa-download"></i> Speichern</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State
    let modElements = [
      {
        id: "super_lava", name: "Super Lava", color: "#ff3300", category: "liquids", state: "liquid",
        density: 3000, tempHigh: 3000, stateHigh: "fire", tempLow: 800, stateLow: "basalt",
        burn: 0, burnTime: 0, fireColor: "#ffaa00", 
        emitEnable: true, emit: "smoke", emitChance: 3,
        reactions: [{ reactWith: "water", product: "stone", chance: 80 }], tick: ""
      },
      {
        id: "magic_powder", name: "Magisches Pulver", color: "#a855f7", category: "fey", state: "powder",
        density: 1200, tempHigh: 500, stateHigh: "spark", tempLow: -50, stateLow: "ice",
        burn: 50, burnTime: 20, fireColor: "#c084fc", 
        emitEnable: false, emit: "", emitChance: 0,
        reactions: [{ reactWith: "fire", product: "explosion", chance: 90 }], tick: ""
      }
    ];

    let activeIdx = 0;
    let currentTab = 'basic';
    const tabs = [
      { id: 'basic', label: 'Grundeigenschaften' },
      { id: 'physics', label: 'Physik & Hitze' },
      { id: 'reactions', label: 'Reaktionen & Emission' },
      { id: 'code', label: 'Tick-Code (JS)' }
    ];

    const categories = ["land", "powder", "liquids", "gases", "fire", "explosives", "states", "life", "weapons", "food", "fey", "special", "energy", "tools", "corruption"];
    const states = ["solid", "powder", "liquid", "gas", "energy", "wall", "immovable", "denser_liquid"];

    // Init
    function init() {
      renderApp();
      initSim();
    }

    // Render Master
    function renderApp() {
      renderSidebar();
      renderEditorHeader();
      renderEditorTabs();
      renderEditorForm(); // The crucial dynamic fix
      updateSimBrushList();
    }

    function renderSidebar() {
      const list = document.getElementById('sidebar-list');
      document.getElementById('elCount').innerText = modElements.length;
      list.innerHTML = modElements.map((el, i) => `
        <div onclick="selectElement(${i})" class="p-3 rounded-lg border cursor-pointer flex items-center justify-between transition ${i === activeIdx ? 'bg-blue-950/40 border-blue-500 shadow-md' : 'bg-slate-950 border-slate-800 hover:border-slate-700'}">
          <div class="flex items-center gap-2 overflow-hidden">
            <div class="w-4 h-4 rounded-full border border-white/20 shrink-0" style="background-color: ${el.color}"></div>
            <div class="truncate">
              <div class="text-xs font-semibold ${i === activeIdx ? 'text-blue-300' : 'text-slate-200'} truncate">${el.name || 'Unbenannt'}</div>
              <div class="text-[10px] text-slate-500 font-mono truncate">${el.id}</div>
            </div>
          </div>
          <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 uppercase tracking-wider shrink-0">${el.state}</span>
        </div>
      `).join('');
    }

    function renderEditorHeader() {
      const el = modElements[activeIdx];
      if(!el) return;
      document.getElementById('editor-header-name').innerText = el.name || 'Unbenannt';
      document.getElementById('editor-header-id').innerText = `ID: ${el.id}`;
      document.getElementById('editor-header-color').style.backgroundColor = el.color;
    }

    function renderEditorTabs() {
      const container = document.getElementById('editor-tabs');
      container.innerHTML = tabs.map(t => `
        <button onclick="switchTab('${t.id}')" class="py-2 px-3 border-b-2 transition ${t.id === currentTab ? 'border-blue-500 text-blue-400 font-semibold' : 'border-transparent text-slate-400 hover:text-slate-200'}">
          ${t.label}
        </button>
      `).join('');
    }

    function renderEditorForm() {
      const el = modElements[activeIdx];
      if(!el) return;
      
      const container = document.getElementById('editor-form-content');
      let html = '';

      if (currentTab === 'basic') {
        html = `
          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Name (Anzeige)</label>
                <input type="text" value="${el.name || ''}" oninput="updateVal('name', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm text-slate-200">
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Identifier (ID)</label>
                <input type="text" value="${el.id || ''}" oninput="updateVal('id', this.value.toLowerCase().replace(/[^a-z0-9_]/g, ''))" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm text-slate-200 font-mono">
              </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Kategorie</label>
                <select onchange="updateVal('category', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm text-slate-200 capitalize">
                  ${categories.map(c => `<option value="${c}" ${el.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Aggregatzustand / Verhalten</label>
                <select onchange="updateVal('state', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm text-slate-200 capitalize">
                  ${states.map(s => `<option value="${s}" ${el.state === s ? 'selected' : ''}>${s.replace('_', ' ')}</option>`).join('')}
                </select>
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">Farbe (Hex)</label>
              <div class="flex gap-2">
                <input type="color" value="${el.color || '#ffffff'}" oninput="updateVal('color', this.value)" class="h-9 w-12 rounded cursor-pointer bg-transparent border border-slate-800">
                <input type="text" value="${el.color || ''}" oninput="updateVal('color', this.value)" class="flex-1 bg-slate-950 border border-slate-800 rounded p-2 text-sm text-slate-200 font-mono">
              </div>
            </div>
          </div>
        `;
      } 
      else if (currentTab === 'physics') {
        html = `
          <div class="space-y-5">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Dichte (Density)</label>
              <input type="number" value="${el.density ?? 1000}" oninput="updateVal('density', parseFloat(this.value))" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm text-slate-200">
            </div>
            
            <div class="border-t border-slate-800 pt-4">
              <h3 class="text-xs font-semibold text-orange-400 mb-3">Hitze & Schmelzen</h3>
              <div class="grid grid-cols-2 gap-4 mb-3">
                <div>
                  <label class="block text-xs text-slate-400 mb-1">Schmelzpunkt °C (tempHigh)</label>
                  <input type="number" value="${el.tempHigh ?? ''}" oninput="updateVal('tempHigh', parseFloat(this.value))" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm text-slate-200">
                </div>
                <div>
                  <label class="block text-xs text-slate-400 mb-1">Wird zu (stateHigh ID)</label>
                  <input type="text" value="${el.stateHigh || ''}" oninput="updateVal('stateHigh', this.value)" placeholder="z.B. lava" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm text-slate-200 font-mono">
                </div>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs text-slate-400 mb-1">Gefrierpunkt °C (tempLow)</label>
                  <input type="number" value="${el.tempLow ?? ''}" oninput="updateVal('tempLow', parseFloat(this.value))" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm text-slate-200">
                </div>
                <div>
                  <label class="block text-xs text-slate-400 mb-1">Wird zu (stateLow ID)</label>
                  <input type="text" value="${el.stateLow || ''}" oninput="updateVal('stateLow', this.value)" placeholder="z.B. ice" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm text-slate-200 font-mono">
                </div>
              </div>
            </div>

            <div class="border-t border-slate-800 pt-4">
              <h3 class="text-xs font-semibold text-red-400 mb-3">Brennbarkeit</h3>
              <div class="grid grid-cols-3 gap-3">
                <div>
                  <label class="block text-xs text-slate-400 mb-1">Brenn-Chance %</label>
                  <input type="number" value="${el.burn ?? 0}" oninput="updateVal('burn', parseFloat(this.value))" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm text-slate-200">
                </div>
                <div>
                  <label class="block text-xs text-slate-400 mb-1">Brennzeit (Ticks)</label>
                  <input type="number" value="${el.burnTime ?? 0}" oninput="updateVal('burnTime', parseFloat(this.value))" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm text-slate-200">
                </div>
                <div>
                  <label class="block text-xs text-slate-400 mb-1">Feuer Farbe</label>
                  <input type="color" value="${el.fireColor || '#ffaa00'}" oninput="updateVal('fireColor', this.value)" class="w-full h-9 rounded bg-transparent border border-slate-800 cursor-pointer">
                </div>
              </div>
            </div>
          </div>
        `;
      }
      else if (currentTab === 'reactions') {
        let emitsHtml = `
          <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 mb-5">
            <div class="flex justify-between items-center mb-2">
              <label class="text-xs font-semibold text-purple-400">Partikel Emission (emit)</label>
              <input type="checkbox" ${el.emitEnable ? 'checked' : ''} onchange="updateVal('emitEnable', this.checked); renderEditorForm();" class="rounded">
            </div>
            ${el.emitEnable ? `
              <div class="grid grid-cols-2 gap-3 mt-2">
                <div>
                  <label class="block text-[11px] text-slate-400 mb-1">Element ID</label>
                  <input type="text" value="${el.emit || ''}" oninput="updateVal('emit', this.value)" placeholder="z.B. smoke" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-slate-200 font-mono">
                </div>
                <div>
                  <label class="block text-[11px] text-slate-400 mb-1">Chance (%)</label>
                  <input type="number" value="${el.emitChance ?? 1}" oninput="updateVal('emitChance', parseFloat(this.value))" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-slate-200">
                </div>
              </div>
            ` : '<p class="text-[10px] text-slate-500">Emission deaktiviert.</p>'}
          </div>
        `;

        let reactionsHtml = `
          <div>
            <div class="flex justify-between items-center mb-2">
              <h3 class="text-xs font-semibold text-slate-200">Reaktionen</h3>
              <button onclick="addReaction()" class="px-2 py-1 bg-blue-600/30 text-blue-300 text-[10px] rounded hover:bg-blue-600/50">+ Neu</button>
            </div>
            <div class="space-y-2">
              ${(!el.reactions || el.reactions.length === 0) ? '<p class="text-xs text-slate-500 italic">Keine Reaktionen.</p>' : ''}
              ${(el.reactions || []).map((r, i) => `
                <div class="bg-slate-950 p-2 rounded border border-slate-800 flex gap-2 items-center">
                  <div class="flex-1">
                    <label class="block text-[9px] text-slate-500">Reagiert mit ID:</label>
                    <input type="text" value="${r.reactWith || ''}" oninput="updateReaction(${i}, 'reactWith', this.value)" class="w-full bg-slate-900 border-none rounded p-1 text-xs text-white font-mono">
                  </div>
                  <div class="flex-1">
                    <label class="block text-[9px] text-slate-500">Produkt ID:</label>
                    <input type="text" value="${r.product || ''}" oninput="updateReaction(${i}, 'product', this.value)" class="w-full bg-slate-900 border-none rounded p-1 text-xs text-white font-mono">
                  </div>
                  <div class="w-12">
                    <label class="block text-[9px] text-slate-500">%:</label>
                    <input type="number" value="${r.chance ?? 100}" oninput="updateReaction(${i}, 'chance', parseFloat(this.value))" class="w-full bg-slate-900 border-none rounded p-1 text-xs text-white">
                  </div>
                  <button onclick="removeReaction(${i})" class="text-red-400 hover:text-red-300 mt-3 px-1"><i class="fa-solid fa-trash text-xs"></i></button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        html = emitsHtml + reactionsHtml;
      }
      else if (currentTab === 'code') {
        html = `
          <div class="h-full flex flex-col">
            <label class="block text-xs text-slate-300 mb-2 font-semibold">Custom JS \`tick(pixel)\` Funktion</label>
            <p class="text-[11px] text-slate-500 mb-3">Ausgeführt bei jedem Frame. Beispiel: <code>if (pixel.temp > 100) ...</code></p>
            <textarea oninput="updateVal('tick', this.value)" class="w-full flex-1 min-h-[250px] bg-slate-950 border border-slate-800 rounded p-3 text-xs text-emerald-400 font-mono resize-none">${el.tick || ''}</textarea>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function switchTab(tabId) {
      currentTab = tabId;
      renderEditorTabs();
      renderEditorForm();
    }

    function selectElement(index) {
      if(index < 0 || index >= modElements.length) return;
      activeIdx = index;
      renderApp();
    }

    // Crucial: This updates the data object. It only triggers a re-render of sidebar/header if necessary,
    // to prevent losing focus in the middle editor text inputs!
    function updateVal(key, val) {
      if(!modElements[activeIdx]) return;
      modElements[activeIdx][key] = val;
      
      if (['name', 'id', 'color', 'state'].includes(key)) {
        renderSidebar();
        renderEditorHeader();
        updateSimBrushList();
      }
    }

    function updateReaction(idx, key, val) {
      if(!modElements[activeIdx].reactions) return;
      modElements[activeIdx].reactions[idx][key] = val;
    }

    function addReaction() {
      if(!modElements[activeIdx].reactions) modElements[activeIdx].reactions = [];
      modElements[activeIdx].reactions.push({ reactWith: '', product: '', chance: 100 });
      renderEditorForm(); // Re-render needed to show new row
    }

    function removeReaction(idx) {
      modElements[activeIdx].reactions.splice(idx, 1);
      renderEditorForm();
    }

    // Array modifications
    function createNewElement() {
      const idStr = `elem_${Math.floor(Math.random()*10000)}`;
      modElements.push({
        id: idStr, name: "Neues Element", color: "#3b82f6", category: "powder", state: "powder",
        density: 1000, reactions: []
      });
      activeIdx = modElements.length - 1;
      renderApp();
    }

    function duplicateCurrent() {
      if(!modElements[activeIdx]) return;
      const clone = JSON.parse(JSON.stringify(modElements[activeIdx]));
      clone.id = clone.id + "_copy";
      clone.name = clone.name + " (Kopie)";
      modElements.push(clone);
      activeIdx = modElements.length - 1;
      renderApp();
    }

    function deleteCurrent() {
      if(modElements.length <= 1) {
        alert("Mindestens ein Element muss existieren.");
        return;
      }
      modElements.splice(activeIdx, 1);
      activeIdx = Math.max(0, activeIdx - 1);
      renderApp();
    }

    function getModCode() {
      let code = `// Generiert mit Sandboxels Mod Studio\n\n`;
      modElements.forEach(el => {
        code += `elements.${el.id} = {\n`;
        code += `  color: "${el.color}",\n`;
        code += `  category: "${el.category}",\n`;
        
        const bMap = { solid: "WALL", powder: "POWDER", liquid: "LIQUID", denser_liquid: "LIQUID", gas: "GAS", energy: "ENERGY", wall: "WALL", immovable: "WALL" };
        code += `  behavior: behaviors.${bMap[el.state] || "POWDER"},\n`;
        code += `  state: "${el.state}",\n`;
        
        if (el.density !== undefined) code += `  density: ${el.density},\n`;
        if (el.tempHigh) code += `  tempHigh: ${el.tempHigh},\n`;
        if (el.stateHigh) code += `  stateHigh: "${el.stateHigh}",\n`;
        if (el.tempLow) code += `  tempLow: ${el.tempLow},\n`;
        if (el.stateLow) code += `  stateLow: "${el.stateLow}",\n`;
        
        if (el.burn > 0) {
          code += `  burn: ${el.burn},\n  burnTime: ${el.burnTime},\n  fireColor: "${el.fireColor}",\n`;
        }
        
        if (el.emitEnable && el.emit) {
          code += `  emit: "${el.emit}",\n  emitChance: ${el.emitChance || 1},\n`;
        }
        
        if (el.reactions && el.reactions.length > 0) {
          code += `  reactions: {\n`;
          el.reactions.forEach(r => {
            if (r.reactWith && r.product) {
              code += `    "${r.reactWith}": { elem1: "${r.product}", chance: ${(r.chance/100).toFixed(2)} },\n`;
            }
          });
          code += `  },\n`;
        }
        
        if (el.tick && el.tick.trim()) {
          code += `  tick: function(pixel) {\n    ${el.tick.replace(/\n/g, '\n    ')}\n  }\n`;
        }
        code += `};\n\n`;
      });
      return code;
    }

    function openExportModal() {
      document.getElementById('exportText').value = getModCode();
      document.getElementById('exportModal').classList.remove('hidden');
    }
    function closeExportModal() { document.getElementById('exportModal').classList.add('hidden'); }
    function copyCode() {
      const t = document.getElementById('exportText');
      t.select(); document.execCommand('copy');
    }
    function downloadCode() {
      const blob = new Blob([getModCode()], { type: 'text/javascript' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `custom_mod.js`;
      a.click();
    }

    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const width = 128, height = 128;
    let grid = new Array(width * height).fill(null);
    let simPaused = false;
    let frames = 0, lastTime = performance.now();
    
    let simState = { brush: '', size: 3, isDown: false, tool: null };
    const builtins = {
      water: { color: '#3b82f6', state: 'liquid', density: 1000 },
      stone: { color: '#64748b', state: 'wall', density: 2500 },
      fire: { color: '#ef4444', state: 'energy', density: 1 }
    };

    function updateSimBrushList() {
      const s = document.getElementById('brushSelect');
      s.innerHTML = `<optgroup label="Deine Elemente">` + 
        modElements.map(e => `<option value="${e.id}">${e.name} (${e.id})</option>`).join('') +
        `</optgroup><optgroup label="Basis Elemente">` +
        Object.keys(builtins).map(k => `<option value="${k}">${k}</option>`).join('') + `</optgroup>`;
      if(!simState.brush && modElements.length > 0) simState.brush = modElements[0].id;
    }

    function setTool(t) {
      simState.tool = simState.tool === t ? null : t;
      ['heat', 'cold', 'eraser'].forEach(x => {
        document.getElementById(`tool-${x}`).classList.toggle('ring-2', simState.tool === x);
        document.getElementById(`tool-${x}`).classList.toggle('ring-blue-400', simState.tool === x);
      });
    }

    function initSim() {
      const handleInput = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const cx = Math.floor((clientX - rect.left) * (width / rect.width));
        const cy = Math.floor((clientY - rect.top) * (height / rect.height));
        
        for(let dy = -simState.size; dy <= simState.size; dy++) {
          for(let dx = -simState.size; dx <= simState.size; dx++) {
            if(dx*dx + dy*dy <= simState.size*simState.size) {
              const x = cx+dx, y = cy+dy;
              if(x>=0 && x<width && y>=0 && y<height) {
                const idx = y*width+x;
                if(simState.tool === 'eraser') grid[idx] = null;
                else if(simState.tool === 'heat' && grid[idx]) grid[idx].temp = (grid[idx].temp||20) + 50;
                else if(simState.tool === 'cold' && grid[idx]) grid[idx].temp = (grid[idx].temp||20) - 50;
                else if(!simState.tool) {
                  let def = modElements.find(el => el.id === simState.brush) || builtins[simState.brush];
                  if(def) grid[idx] = { id: simState.brush, color: def.color, state: def.state, density: def.density||1000, temp: 20 };
                }
              }
            }
          }
        }
      };

      canvas.addEventListener('mousedown', e => { simState.isDown = true; handleInput(e); });
      canvas.addEventListener('mousemove', e => { if(simState.isDown) handleInput(e); });
      window.addEventListener('mouseup', () => simState.isDown = false);
      canvas.addEventListener('touchstart', e => { simState.isDown = true; handleInput(e); });
      canvas.addEventListener('touchmove', e => { if(simState.isDown) { e.preventDefault(); handleInput(e); }});
      window.addEventListener('touchend', () => simState.isDown = false);
      
      requestAnimationFrame(simLoop);
    }

    function toggleSimPause() {
      simPaused = !simPaused;
      document.getElementById('btnPause').innerHTML = simPaused ? '<i class="fa-solid fa-play"></i>' : '<i class="fa-solid fa-pause"></i>';
    }
    function clearSim() { grid.fill(null); }

    function simLoop(now) {
      frames++;
      if(now - lastTime >= 1000) { document.getElementById('fpsCount').innerText = frames; frames = 0; lastTime = now; }
      if(!simPaused) runPhysics();
      renderCanvas();
      requestAnimationFrame(simLoop);
    }

    function runPhysics() {
      let pCount = 0;
      for (let y = height - 1; y >= 0; y--) {
        for (let x = 0; x < width; x++) {
          const idx = y * width + x;
          const p = grid[idx];
          if (!p) continue;
          pCount++;

          const def = modElements.find(e => e.id === p.id);
          if (def) {
             // Reactions & Heat are abstracted here for basic sandbox visualization
             if(def.tempHigh && p.temp >= def.tempHigh && def.stateHigh) { grid[idx].id = def.stateHigh; continue; }
          }

          // Simple gravity for powders/liquids
          if (p.state === 'powder' || p.state === 'liquid' || p.state === 'denser_liquid') {
            if (y + 1 < height) {
              if (!grid[(y+1)*width + x]) {
                grid[(y+1)*width + x] = p; grid[idx] = null;
              } else if (p.state !== 'powder') {
                const dir = Math.random() < 0.5 ? -1 : 1;
                if(x+dir >= 0 && x+dir < width && !grid[y*width + (x+dir)]) {
                  grid[y*width + (x+dir)] = p; grid[idx] = null;
                }
              }
            }
          } else if (p.state === 'gas' && y > 0) {
             if (!grid[(y-1)*width + x]) { grid[(y-1)*width + x] = p; grid[idx] = null; }
          }
        }
      }
      document.getElementById('particleCount').innerText = pCount;
    }

    function renderCanvas() {
      ctx.fillStyle = '#090d16'; ctx.fillRect(0, 0, width, height);
      const imgData = ctx.createImageData(width, height);
      const d = imgData.data;
      for (let i = 0; i < grid.length; i++) {
        const p = grid[i];
        if (p) {
          const hex = p.color.replace('#','');
          const idx = i * 4;
          d[idx] = parseInt(hex.substring(0,2), 16) || 255;
          d[idx+1] = parseInt(hex.substring(2,4), 16) || 255;
          d[idx+2] = parseInt(hex.substring(4,6), 16) || 255;
          d[idx+3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    window.onload = init;
  </script>
</body>
</html>
